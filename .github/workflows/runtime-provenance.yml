name: Vendored runtime provenance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-provenance.yml
      - platform/targets/**
      - "!platform/targets/**/libhost.a"
      - "!platform/targets/**/libhost.h"
      - scripts/canonicalize_runtime_object.py
      - scripts/runtime_probe.c
      - scripts/vendor_zig_runtime.py
      - scripts/zig_runtime.sha256

permissions:
  contents: read

jobs:
  attest:
    name: reproduce and attest vendored runtimes
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned Zig from upstream
        env:
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          ZIG_VERSION: 0.16.0
        run: |
          archive="$RUNNER_TEMP/zig.tar.xz"
          install_dir="$RUNNER_TEMP/zig"
          curl --fail --location --retry 3 \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" \
            --output "$archive"
          echo "$ZIG_SHA256  $archive" | sha256sum --check --strict
          mkdir "$install_dir"
          tar --extract --xz --file "$archive" --directory "$install_dir" \
            --strip-components 1
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Verify central checksum manifest
        run: python scripts/vendor_zig_runtime.py --verify-hashes

      - name: Reproduce and byte-compare every runtime artifact
        run: python scripts/vendor_zig_runtime.py --check

      - name: Attest SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: scripts/zig_runtime.sha256
