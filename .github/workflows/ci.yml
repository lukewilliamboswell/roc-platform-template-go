name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Validate a nightly candidate without publishing or deploying"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendored-runtime-integrity:
    name: verify vendored runtime checksums
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify every vendored runtime artifact
        run: python scripts/vendor_zig_runtime.py --verify-hashes

  cross-build:
    name: cross-build (${{ matrix.builder }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - builder: macos-x64
            os: macos-15-intel
            cc: zig cc
          - builder: macos-arm64
            os: macos-15
            cc: zig cc
          - builder: linux-x64
            os: ubuntu-22.04
            cc: zig cc
          - builder: linux-arm64
            os: ubuntu-24.04-arm
            cc: zig cc
          - builder: windows-2022-x64
            os: windows-2022
            cc: zig cc -target x86_64-windows-gnu
          - builder: windows-2025-x64
            os: windows-2025
            cc: zig cc -target x86_64-windows-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go from .go-version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Zig from upstream
        if: runner.os == 'Linux'
        env:
          ZIG_ARCH: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          ZIG_SHA256: ${{ runner.arch == 'ARM64' && 'ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17' || '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00' }}
          ZIG_VERSION: 0.16.0
        run: |
          archive="$RUNNER_TEMP/zig.tar.xz"
          install_dir="$RUNNER_TEMP/zig"
          curl --fail --location --retry 3 \
            "https://ziglang.org/download/$ZIG_VERSION/zig-$ZIG_ARCH-linux-$ZIG_VERSION.tar.xz" \
            --output "$archive"
          echo "$ZIG_SHA256  $archive" | sha256sum --check --strict
          mkdir "$install_dir"
          tar --extract --xz --file "$archive" --directory "$install_dir" \
            --strip-components 1
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Install Zig
        if: runner.os != 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-cache: false

      - name: Read pinned Roc version
        run: python scripts/export_roc_version.py

      - name: Install pinned Roc nightly
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Show pinned toolchains
        run: |
          go version
          zig version
          roc version
          python --version

      - name: Check generated C host bindings
        # `roc glue` is targetless, so every producer would generate the same file.
        if: matrix.builder == 'linux-x64'
        run: python scripts/generate_c_glue.py --check

      - name: Test Go host units
        working-directory: host
        run: |
          go test ./...
          go vet ./...
        env:
          CC: ${{ matrix.cc }}
          CGO_ENABLED: "1"

      - name: Check Roc formatting
        run: python scripts/check_roc_format.py

      - name: Generate platform documentation
        run: roc docs platform/main.roc --output=ci-docs --no-cache

      - name: Cross-compile every Go host
        run: python scripts/build.py --all

      - name: Bundle platform, validate examples, and cross-compile test apps
        run: python scripts/test.py --operation produce --output-dir ci-output/binaries --bundle-output-dir ci-output/bundle --target x64mac --target arm64mac --target x64musl --target x64v1musl --target arm64musl --target arm64v1musl --target x64mingw --target x64v1mingw --target arm64mingw --target arm64v1mingw --verbose

      - name: Upload cross-compiled test apps
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apps-${{ matrix.builder }}
          path: ci-output
          if-no-files-found: error
          retention-days: 7

  run-cross-built:
    name: run ${{ matrix.target }} from every builder
    needs: cross-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64mac
            os: macos-15-intel
          - target: arm64mac
            os: macos-15
          - target: x64musl
            os: ubuntu-22.04
          - target: x64v1musl
            os: ubuntu-22.04
          - target: arm64musl
            os: ubuntu-24.04-arm
          - target: arm64v1musl
            os: ubuntu-24.04-arm
          - target: x64mingw
            os: windows-2022
          - target: x64v1mingw
            os: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download app artifacts from every builder
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: apps-*
          path: ci-artifacts

      - name: Run every case against every builder output
        run: python scripts/run_ci_artifacts.py --artifacts-root ci-artifacts --target ${{ matrix.target }} --verbose
