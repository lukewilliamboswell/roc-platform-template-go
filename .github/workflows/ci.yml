name: CI

on:
  workflow_call:
    inputs:
      release_version:
        type: string
        required: false
        default: "0.1.0-dev"
      runtime_candidate_artifact:
        type: string
        required: false
        default: ""
      runtime_candidate_sha256:
        type: string
        required: false
        default: ""
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Candidate inputs exist only on workflow_call, never on manual dispatch.
env:
  RUNTIME_CANDIDATE_SHA256: ${{ inputs.runtime_candidate_sha256 || '' }}
  LINKER_INPUTS_CANDIDATE_SHA256: ${{ inputs.runtime_candidate_sha256 || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: Resolve latest Roc nightly
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve once for every builder
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)
          [[ "$tag" =~ ^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{7,40}$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Testing $tag" >> "$GITHUB_STEP_SUMMARY"

  runtime-integrity:
    name: runtime tooling and source policy
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Test maintenance tooling
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Check tracked binary policy
        run: python scripts/check_no_binaries.py


  cross-build:
    needs: compiler
    name: current-source (${{ matrix.builder }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - builder: linux-x64
            os: ubuntu-22.04
            cc: zig cc

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"

      - name: Install locked Blueprint environment
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@a25b5129340b9b2ad1744d20330b8ee4d38a1849
        with:
          cache: 'true'
          cache-workload: platform-host

      - run: blueprint check

      - name: Install resolved Roc nightly
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.compiler.outputs.tag }}

      - run: blueprint run check
      - run: blueprint run check-glue
      - run: blueprint run test-host

      - name: Download same-run runtime candidate
        if: inputs.runtime_candidate_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.runtime_candidate_artifact }}
          path: runtime-candidate

      - name: Install same-run runtime candidate
        if: inputs.runtime_candidate_artifact != ''
        shell: bash
        env:
          CANDIDATE_SHA256: ${{ inputs.runtime_candidate_sha256 }}
        run: |
          python scripts/linker_inputs.py stage runtime-candidate/roc-go-linker-inputs-*.tar.gz --sha256 "$CANDIDATE_SHA256"

      - name: Fetch and authenticate runtime release
        if: inputs.runtime_candidate_artifact == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .linker-inputs-cache
          key: linker-inputs-${{ runner.os }}-${{ hashFiles('link-inputs.lock.json') }}
      - name: Download a cache miss and verify every cache hit
        if: inputs.runtime_candidate_artifact == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: blueprint run fetch-runtime

      - name: Restore hosts with the same complete build inputs
        id: hosts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            platform/targets/*/libhost.a
            platform/targets/*/libhost.h
          key: go-host-linux-x64-${{ hashFiles('host/**', 'Blueprint.roc', 'Blueprint.lock', '.go-version', 'scripts/build.py') }}

      - name: Cross-compile every Go host
        if: steps.hosts.outputs.cache-hit != 'true'
        run: blueprint run build-host

      - name: Bundle platform, validate examples, and cross-compile test apps
        run: blueprint run produce -- --output-dir ci-output/binaries --bundle-output-dir ci-output/bundle --target x64mac --target arm64mac --target x64musl --target x64v1musl --target arm64musl --target arm64v1musl --target x64mingw --target x64v1mingw --verbose

      - name: Package the release dry run from the tested bundle
        env:
          RELEASE_VERSION: ${{ inputs.release_version || '0.1.0-dev' }}
        shell: bash
        run: |
          bundle=(ci-output/bundle/*.tar.zst)
          test "${#bundle[@]}" = 1
          blueprint run package-release -- --bundle "${bundle[0]}" --version "$RELEASE_VERSION" --output-dir ci-output/release

      - name: Generate and validate artifact-bound SPDX and CycloneDX inventories
        env:
          RELEASE_VERSION: ${{ inputs.release_version || '0.1.0-dev' }}
        run: blueprint run sbom -- --directory ci-output/release --version "$RELEASE_VERSION"

      - name: Upload cross-compiled test apps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apps-${{ matrix.builder }}
          path: ci-output
          if-no-files-found: error
          retention-days: 7

  run-cross-built:
    name: native (${{ matrix.target }})
    needs: [compiler, cross-build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64mac
            os: macos-15-intel
          - target: arm64mac
            os: macos-15
          - target: x64musl
            os: ubuntu-22.04
          - target: x64v1musl
            os: ubuntu-22.04
          - target: arm64musl
            os: ubuntu-24.04-arm
          - target: arm64v1musl
            os: ubuntu-24.04-arm
          - target: x64mingw
            os: windows-2022
          - target: x64v1mingw
            os: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Download app artifacts from every builder
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apps-linux-x64
          path: ci-artifacts/apps-linux-x64

      - name: Install the same resolved Roc nightly
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.compiler.outputs.tag }}

      - name: Link and run the exact release archive
        shell: bash
        run: |
          release=ci-artifacts/apps-linux-x64/release
          bundle=("$release"/*.tar.zst)
          archive=("$release"/*-examples-*.zip)
          python scripts/test_release.py --archive "${archive[0]}" --bundle "${bundle[0]}" --target '${{ matrix.target }}'

      - name: Run every case against every builder output
        run: python scripts/run_ci_artifacts.py --artifacts-root ci-artifacts --target ${{ matrix.target }} --verbose

  result:
    name: CI result
    if: always()
    needs: [compiler, runtime-integrity, cross-build, run-cross-built]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every validation lane
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              raise SystemExit(f"Validation did not pass: {failed}")
          PYCODE
