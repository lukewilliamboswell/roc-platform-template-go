name: Publish PR linker inputs
on:
  workflow_dispatch:
    inputs:
      pull-request:
        description: Open same-repository PR containing the linker-input change
        type: string
        required: true
permissions: {}
concurrency:
  group: publish-link-inputs
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'lukewilliamboswell/roc-platform-template-go'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: write
      attestations: read
      contents: write
      pull-requests: read
    steps:
      - uses: lukewilliamboswell/roc-automation/actions/publish-build-inputs@26f35e78f19c761b0160768f267e321dbccac3c7
        with:
          pull-request: ${{ inputs.pull-request }}
          producer-workflow: release-runtime.yml
          candidate-artifact: link-input-release
          lock-path: link-inputs.lock.json
          release-prefix: link-inputs
        env:
          GH_TOKEN: ${{ github.token }}
